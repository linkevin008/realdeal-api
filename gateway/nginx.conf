# Local stand-in for the AWS Application Load Balancer.
#
# Each location block corresponds to a future ALB listener rule. When
# realdeal-infra/cloudformation/compute.yaml gains path-based routing for
# multiple ECS services, its listener rules must mirror this file rule-for-rule.
# The upstream name == the compose service name == the future ECS service name.

upstream core {
    server core:8080;
}

upstream lookup {
    server lookup:8080;
}

server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ALB listener rule: path-pattern /api/v1/search/* -> lookup target group
    location /api/v1/search/ {
        proxy_pass http://lookup;
    }

    # ALB default action -> core target group.
    # Also serves /health (the ALB target-group health check path).
    location / {
        proxy_pass http://core;
    }
}
